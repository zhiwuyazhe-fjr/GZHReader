[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gzhreader-core"
dynamic = ["version"]
description = "Local desktop core for GZHReader"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "chardet>=5.2,<6",
  "httpx>=0.28.1",
  "playwright>=1.52.0",
  "readability-lxml>=0.8.4.1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4"]
build = ["pyinstaller>=6.12"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "gzhreader_core.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gzhreader_core*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --basetemp=.pytest_tmp"
testpaths = ["tests"]
