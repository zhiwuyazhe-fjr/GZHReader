name: Build and release Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            .\scripts\build_validate_versions.ps1 -Tag $env:GITHUB_REF_NAME
          } else {
            .\scripts\build_validate_versions.ps1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,build]"

      - name: Run Python tests
        run: python -m pytest

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop regression tests
        working-directory: desktop
        run: npm test

      - name: Build Python Sidecar
        shell: pwsh
        run: .\scripts\build_sidecar.ps1

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: GZHReader v__VERSION__
          releaseBody: "Windows 本地桌面工作台更新。"
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi
